<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Agregar el script de Babel -->
    <script src="https://unpkg.com/@babel/standalone"></script>
    <script type="text/babel" src="/context/count-context.js"></script>
</head>
<body>
    <div id="root">

    </div>
</body>
<script type="text/babel">
    
    const { useState, createContext, useContext } = React;
    //const CountContext = createContext(null)
    const {CountContext, CountContextProvider} = window;
    const UserContext = createContext(null)

    function App(){
        const [count, setCount] = useState(0)
        const [user, setUser] = useState({
            name: "Juan",
            age: 25,
            email: "juan@gmail.com"
        })
        
        return(
            <div>
                <CountContextProvider>
                    <Component1/>
                    <Component2/>
                </CountContextProvider>
                <UserContext.Provider value={{user, setUser}}>
                    <ProfileUser/>
                    <SearchUser/>    
                </UserContext.Provider>
                
            </div>
        )
    }

    function ProfileUser(){
        const { user, setUser } = useContext(UserContext)
        return(
            <div>
                <h2>Perfil del usuario</h2>
                <p>Nombre; {user.name}</p>
                <p>Edad; {user.age}</p>
                <p>Email: {user.email}</p>
            </div>
        )
    }

    function SearchUser(){
        const {user, setUser} = useContext(UserContext)
        return(
            <div>
                <label for="">Nombre a buscar</label>
                <input type="text" value={user.name} onChange={buscarUusario}/>

                <label for="">Edad a buscar</label>
                <input type="text" value={user.age}/>

                <label for="">Email a buscar</label>
                <input type="text" value={user.email}/>
            </div>
        )
    }

    function buscarUusario(event){
        const {user, setUser} = React.useContext(UserContext)
        //console.log(event.target.value)
        //setUser({
            //name: event.target.value,
            //age:user.age,
            //email: user.email
        //})
    }

    function Component1(){
        const {count, setCount} = React.useContext(CountContext)
        return(
            <div>
                <button onClick={()=> setCount(count+1)}>Incrementar</button>
                <p>Contador: {count}</p>
                <h2>Componente 1</h2>    
            </div>
        )
    }
    function Component2(){
        const {count2, setCount2} = React.useContext(CountContext)
        return(
            <div>
                <h2>Componente 2</h2>
                <p>Contador: {count2}</p>
                <button onClick={()=> setCount2(count2-1)}>Incrementar</button>    
            </div>
        )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App/>)
</script>

</html>
